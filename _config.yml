# ---------------------------------------------------------------
# Hexo 站点配置
# 文档: https://hexo.io/zh-cn/docs/configuration
# ---------------------------------------------------------------

# Site
title: Siusen 的博客
subtitle: '...'
description: '想到啥写啥'
keywords: 技术博客,Web开发,后端,Node.js,Hexo
author: Siusen
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://shenX-2021.github.io
root: /
permalink: posts/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :year-:month-:day-:title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
marked:
  prependRoot: true
  postAsset: true
relative_link: false
future: true
highlight:
  enable: false
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
## 文档: https://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# Pagination
## 设为 0 表示禁用分页（每页显示全部）
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
## 主题: https://theme-next.js.org/
theme: next

# Deployment
## 这里留空，发布由 GitHub Actions 完成
deploy:

# ---------------------------------------------------------------
# 插件配置
# ---------------------------------------------------------------

# 本地搜索数据源（NexT 的 local_search 依赖它生成 /search.xml）
## https://github.com/next-theme/hexo-generator-searchdb
search:
  path: search.xml
  field: post
  content: true
  format: html

# RSS / Atom 订阅
## https://github.com/hexojs/hexo-generator-feed
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true
  content_limit: 140
  content_limit_delim: ''
  order_by: -date
  autodiscovery: true

# 站点地图（SEO）
## https://github.com/hexojs/hexo-generator-sitemap
sitemap:
  path:
    - sitemap.xml
    - sitemap.txt
  tag: true
  category: true
  rel: false
